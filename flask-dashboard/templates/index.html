<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArdPix Display</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container { text-align: center; }
        .label { font-size: 2rem; color: #666; margin-bottom: 20px; }
        .value { font-size: 8rem; font-weight: bold; text-shadow: 0 0 20px #fff; }
        
        #pix-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #qr-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #qr-image { width: 300px; height: 300px; object-fit: contain; }
        .amount-display { font-size: 3rem; margin-bottom: 20px; color: #fff; }
        
        .btn-close {
            padding: 15px 40px; font-size: 1.2rem; cursor: pointer;
            background: #fff; border: none; border-radius: 5px; margin-top: 20px; font-weight: bold;
        }
        
        /* Botão Admin Discreto */
        .admin-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #333;
            text-decoration: none;
            border: 1px solid #333;
            padding: 5px 10px;
            font-size: 12px;
            transition: 0.3s;
        }
        .admin-btn:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="label">TOTAL A PAGAR</div>
        <div class="value" id="display-value">R$ 0,00</div>
    </div>

    <a href="/admin" class="admin-btn">ADMIN</a>

    <div id="pix-modal">
        <div class="amount-display" id="modal-amount">R$ 0,00</div>
        <div id="qr-box">
            <img id="qr-image" src="" alt="Aguardando QR Code...">
        </div>
        <div style="color: #aaa; margin-top: 10px;">Escaneie para pagar</div>
        <button class="btn-close" onclick="closeModal()">FECHAR</button>
    </div>

    <script>
        const socket = io();
        const displayEl = document.getElementById('display-value');
        const modalEl = document.getElementById('pix-modal');
        const modalAmountEl = document.getElementById('modal-amount');
        const qrImageEl = document.getElementById('qr-image');

        const formatMoney = (val) => parseFloat(val).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        socket.on('value_update', (data) => {
            displayEl.textContent = formatMoney(data.value);
        });

        socket.on('pix_generated', (data) => {
            modalAmountEl.textContent = formatMoney(data.amount);
            if (data.qrCodeBase64) qrImageEl.src = data.qrCodeBase64;
            modalEl.style.display = 'flex';
        });

        function closeModal() {
            modalEl.style.display = 'none';
            qrImageEl.src = ""; 
        }

        // Carregar valor inicial
        fetch('/api/current-value')
            .then(r => r.json())
            .then(data => displayEl.textContent = formatMoney(data.current_value));
    </script>
</body>
</html>
